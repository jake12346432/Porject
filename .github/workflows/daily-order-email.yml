name: Send daily combined order email

on:
  schedule:
    # 15:00 UTC every day. GitHub's schedule trigger can run a few minutes
    # late under load — that's normal and not something to chase.
    - cron: "0 15 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab, for testing

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the daily order report email
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          SITE_USERNAME: ${{ secrets.SITE_USERNAME }}
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          set -e
          if [ -z "$SITE_URL" ] || [ -z "$SITE_USERNAME" ] || [ -z "$SITE_PASSWORD" ]; then
            echo "::error::Missing one or more repo secrets (SITE_URL, SITE_USERNAME, SITE_PASSWORD) — see README for setup."
            exit 1
          fi

          status=$(curl -sS -o response.json -w "%{http_code}" \
            -u "$SITE_USERNAME:$SITE_PASSWORD" \
            -X POST "$SITE_URL/api/daily-orders/email-report" \
            --max-time 90)

          echo "Response body:"
          cat response.json
          echo ""
          echo "HTTP status: $status"

          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Request failed with HTTP $status — see response body above."
            exit 1
          fi
